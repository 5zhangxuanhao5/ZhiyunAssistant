name: Android checks
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Shared logic and web assets
        env:
          ZJU_CAMPUS_MODEL_API_KEY: ${{ github.event_name != 'pull_request' && secrets.ZJU_CAMPUS_MODEL_API_KEY || '' }}
          ZJU_CAMPUS_OCR_API_KEY: ${{ github.event_name != 'pull_request' && secrets.ZJU_CAMPUS_OCR_API_KEY || '' }}
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
          npm run build:web
      - name: Native policies, lint and unsigned release
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --no-daemon
      - name: APK privacy and resource audit
        run: node scripts/package-audit.cjs app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Android-unsigned-build-not-for-installation
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
